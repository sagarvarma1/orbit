name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: End-to-end (real builds incl. Next.js SSR, child-process builder)
        run: ORBIT_BUILDER=process node scripts/e2e.mjs --next
      - name: Dashboard production build
        run: pnpm --filter @orbit/dashboard build

  sandbox:
    # Production's edge runs as root on Linux: deployment code runs as per-project users behind a
    # firewall. Test exactly that, including full deployments, in a root container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox tests and end-to-end as root
        run: ./scripts/sandbox-test.sh --e2e

  sandbox-containers:
    # Production runs deployment code in sandbox containers under gVisor. Install it and run a real
    # sandboxd against this runner's Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor
        run: |
          sudo curl -fsSL https://gvisor.dev/archive.key -o /usr/share/keyrings/gvisor-archive-keyring.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.asc] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq && sudo apt-get install -y -qq runsc
          sudo runsc install -- --host-uds=create
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep runsc
      - name: Sandbox containers (gVisor)
        run: ORBIT_SANDBOXD_EXPECT_RUNTIME=runsc ./scripts/sandbox-test.sh --containers
