# Production Orbit: prebuilt images behind Caddy (automatic HTTPS).
# install.sh puts this file, the Caddyfile and a generated .env in /opt/orbit.
#
#   cd /opt/orbit && docker compose up -d
#
# Builds run in sibling containers through the host's Docker socket, so bind mounts must use
# host paths: ORBIT_DATA_DIR on the host is mounted at the same path inside the containers.

x-orbit-env: &orbit-env
  ORBIT_DATA_DIR: ${ORBIT_DATA_DIR:-/opt/orbit/data}
  ORBIT_ROOT_DOMAIN: ${ORBIT_ROOT_DOMAIN:?set ORBIT_ROOT_DOMAIN in .env}
  ORBIT_PUBLIC_PROTOCOL: https
  ORBIT_PUBLIC_EDGE_PORT: "443"
  NODE_ENV: production

services:
  api:
    image: ${ORBIT_IMAGE_PREFIX:-ghcr.io/sagarvarma1/orbit}-api:${ORBIT_VERSION:-latest}
    environment:
      <<: *orbit-env
      ORBIT_HOST_DATA_DIR: ${ORBIT_DATA_DIR:-/opt/orbit/data}
      ORBIT_DASHBOARD_URL: https://${ORBIT_APP_DOMAIN:?set ORBIT_APP_DOMAIN in .env}
      ORBIT_BUILDER: docker
      TRUST_PROXY: "1"
      BUILD_CONCURRENCY: ${BUILD_CONCURRENCY:-2}
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-600}
      BUILD_MEMORY: ${BUILD_MEMORY:-2g}
      BUILD_CPUS: ${BUILD_CPUS:-2}
      GIT_POLL_INTERVAL_SECONDS: ${GIT_POLL_INTERVAL_SECONDS:-60}
      ORBIT_PUBLIC_IP: ${ORBIT_PUBLIC_IP:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ORBIT_RESET_ADMIN_PASSWORD: ${ORBIT_RESET_ADMIN_PASSWORD:-}
      # "open" lets anyone sign up with GitHub; each account only sees its own projects.
      ORBIT_SIGNUPS: ${ORBIT_SIGNUPS:-closed}
      ORBIT_ADMIN_GITHUB: ${ORBIT_ADMIN_GITHUB:-}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-10}
      MAX_ACTIVE_BUILDS_PER_USER: ${MAX_ACTIVE_BUILDS_PER_USER:-2}
      # Cron jobs: the control plane calls the edge on the Docker network.
      ORBIT_EDGE_INTERNAL_URL: http://edge:8080
    volumes:
      - ${ORBIT_DATA_DIR:-/opt/orbit/data}:${ORBIT_DATA_DIR:-/opt/orbit/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  edge:
    image: ${ORBIT_IMAGE_PREFIX:-ghcr.io/sagarvarma1/orbit}-api:${ORBIT_VERSION:-latest}
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/edge.js"]
    environment:
      <<: *orbit-env
      # Deployment code runs in sandbox containers started by sandboxd; the edge only routes to them.
      ORBIT_SANDBOX: container
    volumes:
      - ${ORBIT_DATA_DIR:-/opt/orbit/data}:${ORBIT_DATA_DIR:-/opt/orbit/data}
    depends_on: [sandboxd]
    restart: unless-stopped

  # Starts a container per function instance and app server: read-only code at /var/task, only
  # /tmp writable, memory/CPU/process limits, no capabilities, gVisor when installed, and a network
  # that reaches the internet but not private addresses or this host. It needs the Docker socket
  # and the host's network namespace (for that firewall), so it has no ports and talks only to the
  # edge, over a root-only unix socket in the data directory.
  sandboxd:
    image: ${ORBIT_IMAGE_PREFIX:-ghcr.io/sagarvarma1/orbit}-api:${ORBIT_VERSION:-latest}
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/sandboxd.js"]
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      <<: *orbit-env
      ORBIT_HOST_DATA_DIR: ${ORBIT_DATA_DIR:-/opt/orbit/data}
      ORBIT_RUNTIME_IMAGE: ${ORBIT_IMAGE_PREFIX:-ghcr.io/sagarvarma1/orbit}-runtime:${ORBIT_VERSION:-latest}
      ORBIT_SANDBOX_RUNTIME: ${ORBIT_SANDBOX_RUNTIME:-auto}
    volumes:
      - ${ORBIT_DATA_DIR:-/opt/orbit/data}:${ORBIT_DATA_DIR:-/opt/orbit/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  dashboard:
    image: ${ORBIT_IMAGE_PREFIX:-ghcr.io/sagarvarma1/orbit}-dashboard:${ORBIT_VERSION:-latest}
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ORBIT_APP_DOMAIN: ${ORBIT_APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, edge, dashboard]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
