# Production overrides (Compose v2.24+ for !override): docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml up -d --build
# Orbit's ports bind to localhost only; Caddy is the single public entry point (80/443).
services:
  api:
    ports: !override ["127.0.0.1:4000:4000"]
    environment:
      ORBIT_ROOT_DOMAIN: ${ORBIT_ROOT_DOMAIN:?set ORBIT_ROOT_DOMAIN, e.g. example.com}
      ORBIT_PUBLIC_PROTOCOL: https
      ORBIT_PUBLIC_EDGE_PORT: "443"
      ORBIT_BUILDER: docker
      GIT_POLL_INTERVAL_SECONDS: "0"

  edge:
    ports: !override ["127.0.0.1:8080:8080"]
    environment:
      ORBIT_ROOT_DOMAIN: ${ORBIT_ROOT_DOMAIN}
      ORBIT_PUBLIC_PROTOCOL: https
      ORBIT_PUBLIC_EDGE_PORT: "443"

  dashboard:
    ports: !override ["127.0.0.1:3000:3000"]
    build:
      args:
        NEXT_PUBLIC_API_URL: https://app.${ORBIT_ROOT_DOMAIN}

  caddy:
    # Relative paths resolve from the repo root (the first compose file's directory).
    build: { context: ./deploy, dockerfile: caddy.Dockerfile }
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
